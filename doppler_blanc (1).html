
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#ffffff;font-family:system-ui,-apple-system,sans-serif;}
</style>

<div style="width:100%;height:60vh;min-height:300px;position:relative;border-radius:12px;overflow:hidden;margin-bottom:12px;background:#ffffff;">
  <canvas id="cv" style="position:absolute;top:0;left:0;width:100%;height:100%;display:block;"></canvas>
</div>

<div id="fml" style="font-size:13px;padding:10px 16px;border-radius:20px;background:#f5f5f5;border:1.5px solid #d0d0d0;color:#2c2c2a;margin:0 0 10px;font-family:ui-monospace,monospace;line-height:1.8;display:block;width:100%;">
  Source immobile — cercles concentriques, λ' = λ
</div>

<div style="display:flex;align-items:center;gap:12px;margin:6px 0;">
  <span style="min-width:150px;font-size:13px;font-weight:500;color:#2c2c2a;background:#f5f5f5;border:1.5px solid #d0d0d0;border-radius:20px;padding:6px 16px;white-space:nowrap;">Vitesse source</span>
  <input type="range" id="vs" min="0" max="75" value="0" step="1" style="flex:1;accent-color:#378ADD;">
  <span id="vsv" style="min-width:62px;text-align:center;font-size:13px;font-weight:500;color:#2c2c2a;background:#f5f5f5;border:1.5px solid #d0d0d0;border-radius:20px;padding:6px 12px;">0 m/s</span>
</div>

<div style="display:flex;align-items:center;gap:12px;margin:6px 0;">
  <span style="min-width:150px;font-size:13px;font-weight:500;color:#2c2c2a;background:#f5f5f5;border:1.5px solid #d0d0d0;border-radius:20px;padding:6px 16px;white-space:nowrap;">Vitesse propagation</span>
  <input type="range" id="vp" min="1" max="20" value="5" step="1" style="flex:1;accent-color:#378ADD;">
  <span id="vpv" style="min-width:62px;text-align:center;font-size:13px;font-weight:500;color:#2c2c2a;background:#f5f5f5;border:1.5px solid #d0d0d0;border-radius:20px;padding:6px 12px;">5 u/s</span>
</div>

<div style="display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap;">
  <button onclick="setV(0)"   style="padding:8px 20px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid #d0d0d0;background:#ffffff;color:#2c2c2a;">Immobile</button>
  <button onclick="setV(30)"  style="padding:8px 20px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid #d0d0d0;background:#ffffff;color:#2c2c2a;">vs modérée</button>
  <button onclick="setV(60)"  style="padding:8px 20px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid #d0d0d0;background:#ffffff;color:#2c2c2a;">vs rapide</button>
  <button id="btn-p" onclick="togglePause()" style="padding:8px 20px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid #185fa5;background:#e6f1fb;color:#185fa5;">Pause</button>
  <button onclick="restart()" style="padding:8px 20px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid #f09595;background:#fcebeb;color:#a32d2d;">Recommencer</button>
</div>

<script>
const cv=document.getElementById('cv');
const COLS=['#1D9E75','#378ADD','#7F77DD','#D4537E','#D85A30','#BA7517','#639922','#0F6E56'];
const EMIT_PERIOD=90,SRC_SCALE=0.06;
let paused=false,t=0,srcX=0,srcY=0,emitClock=EMIT_PERIOD,wIdx=0,waves=[];
let W=0,H=0,initialized=false;

function setV(v){document.getElementById('vs').value=v;updateInfo();}

function updateInfo(){
  const vs=parseFloat(document.getElementById('vs').value);
  const vp=parseFloat(document.getElementById('vp').value);
  document.getElementById('vsv').textContent=vs+' m/s';
  document.getElementById('vpv').textContent=vp+' u/s';
  const M=(vs/100).toFixed(2);
  const fF=(100/(100-vs)).toFixed(2);
  const fB=(100/(100+vs)).toFixed(2);
  document.getElementById('fml').innerHTML=vs==0
    ?"Source immobile — cercles concentriques, λ' = λ"
    :`λ' devant = (v−vs)/f → f' = ${fF}·f &nbsp;|&nbsp; λ' derrière = (v+vs)/f → f' = ${fB}·f &nbsp;(Mach = ${M})`;
}

document.getElementById('vs').addEventListener('input',updateInfo);
document.getElementById('vp').addEventListener('input',updateInfo);

function togglePause(){
  paused=!paused;
  const btn=document.getElementById('btn-p');
  if(paused){
    btn.textContent='Reprendre';
    btn.style.cssText='padding:8px 20px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid #f09595;background:#fcebeb;color:#a32d2d;';
  } else {
    btn.textContent='Pause';
    btn.style.cssText='padding:8px 20px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid #185fa5;background:#e6f1fb;color:#185fa5;';
  }
}

function restart(){waves=[];emitClock=EMIT_PERIOD;wIdx=0;t=0;srcX=W/2;srcY=H/2;}

function syncSize(){
  const rect=cv.parentElement.getBoundingClientRect();
  const nW=Math.round(rect.width)||700;
  const nH=Math.round(rect.height)||400;
  if(nW!==W||nH!==H){
    W=nW;H=nH;cv.width=W;cv.height=H;
    if(!initialized){srcX=W/2;srcY=H/2;initialized=true;}
  }
}

function frame(){
  syncSize();
  if(W===0||H===0){requestAnimationFrame(frame);return;}
  const ctx=cv.getContext('2d');
  const vs=parseFloat(document.getElementById('vs').value);
  const vp=parseFloat(document.getElementById('vp').value);

  if(!paused){
    t++;srcX+=vs*SRC_SCALE;emitClock++;
    if(emitClock>=EMIT_PERIOD){
      emitClock=0;
      waves.push({bx:srcX,by:srcY,r:1,col:COLS[wIdx%COLS.length],idx:wIdx});
      wIdx++;
    }
    for(const w of waves) w.r+=vp;
    const maxR=Math.sqrt(W*W+H*H);
    for(let i=waves.length-1;i>=0;i--) if(waves[i].r>maxR) waves.splice(i,1);
    if(srcX>W+80) restart();
  }

  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(0,0,0,0.05)';
  ctx.lineWidth=0.6;ctx.setLineDash([3,10]);
  ctx.beginPath();ctx.moveTo(0,srcY);ctx.lineTo(W,srcY);ctx.stroke();
  ctx.setLineDash([]);

  for(const w of waves){
    if(w.r<1) continue;
    const alpha=Math.max(0,1-(w.r/Math.sqrt(W*W+H*H))*1.1);
    const hex=Math.round(alpha*220).toString(16).padStart(2,'0');
    ctx.beginPath();ctx.arc(w.bx,w.by,w.r,0,Math.PI*2);
    ctx.strokeStyle=w.col+hex;ctx.lineWidth=2;ctx.stroke();
    ctx.beginPath();ctx.arc(w.bx,w.by,4,0,Math.PI*2);
    ctx.fillStyle=w.col+'99';ctx.fill();
    ctx.fillStyle=w.col+'cc';ctx.font='500 11px system-ui,sans-serif';ctx.textAlign='center';
    ctx.fillText('S'+(w.idx+1),w.bx,w.by-10);
  }

  if(vs>2&&waves.length>=2){
    for(let i=0;i<waves.length-1;i++){
      const w1=waves[i],w2=waves[i+1];
      const x1=w1.bx-w1.r,x2=w2.bx-w2.r,gap=x2-x1;
      if(gap>6&&x1>10&&x2<W-10){
        const midX=(x1+x2)/2,y=w1.by+28;
        if(y<H-16){
          ctx.strokeStyle='#378ADD';ctx.lineWidth=1.2;
          ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.stroke();
          ctx.beginPath();ctx.moveTo(x1,y-4);ctx.lineTo(x1,y+4);ctx.stroke();
          ctx.beginPath();ctx.moveTo(x2,y-4);ctx.lineTo(x2,y+4);ctx.stroke();
          if(gap>28){ctx.fillStyle='#378ADD';ctx.font='11px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText("λ'",midX,y+13);}
        }
      }
      const rx1=w1.bx+w1.r,rx2=w2.bx+w2.r,rgap=rx1-rx2;
      if(rgap>6&&rx2>10&&rx1<W-10){
        const midRX=(rx1+rx2)/2,ry=w1.by-28;
        if(ry>16){
          ctx.strokeStyle='#E24B4A';ctx.lineWidth=1.2;
          ctx.beginPath();ctx.moveTo(rx2,ry);ctx.lineTo(rx1,ry);ctx.stroke();
          ctx.beginPath();ctx.moveTo(rx2,ry-4);ctx.lineTo(rx2,ry+4);ctx.stroke();
          ctx.beginPath();ctx.moveTo(rx1,ry-4);ctx.lineTo(rx1,ry+4);ctx.stroke();
          if(rgap>28){ctx.fillStyle='#E24B4A';ctx.font='11px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText("λ'",midRX,ry-6);}
        }
      }
    }
  }

  const sr=15;
  ctx.beginPath();ctx.arc(srcX,srcY,sr,0,Math.PI*2);
  ctx.fillStyle='#ffffff';ctx.fill();
  ctx.strokeStyle='#5f5e5a';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='#3d3d3a';ctx.font='500 13px system-ui,sans-serif';ctx.textAlign='center';
  ctx.fillText('S',srcX,srcY+5);

  if(vs>0){
    ctx.beginPath();ctx.strokeStyle='#3d3d3a';ctx.lineWidth=1.4;
    ctx.moveTo(srcX+sr+2,srcY);ctx.lineTo(srcX+sr+16,srcY);ctx.stroke();
    ctx.beginPath();ctx.fillStyle='#3d3d3a';
    ctx.moveTo(srcX+sr+22,srcY);ctx.lineTo(srcX+sr+12,srcY-5);ctx.lineTo(srcX+sr+12,srcY+5);
    ctx.closePath();ctx.fill();
    ctx.font='11px system-ui,sans-serif';ctx.textAlign='left';
    ctx.fillStyle='#888';
    ctx.fillText('vs',srcX+sr+24,srcY-3);
  }

  ctx.fillStyle='#bbb';
  ctx.font='11px system-ui,sans-serif';ctx.textAlign='left';
  ctx.fillText('Mach='+(vs/100).toFixed(2)+'   v_prop='+vp+' u/s',10,H-10);
  requestAnimationFrame(frame);
}

updateInfo();
frame();
</script>
